name: CI/CD Pipeline Simulation (lint, build, run)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg  # headless plotting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show workspace structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Files:"
          ls -lah

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Try to install your file if it exists
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt || true
          fi
          # Always ensure these are installed
          pip install --upgrade pandas matplotlib seaborn

      - name: Smoke test (CSV read + basic stats)
        run: |
          python - <<'PY'
          import os, pandas as pd
          file_path = "All_Diets.csv"
          assert os.path.exists(file_path), f"{file_path} not found!"
          df = pd.read_csv(file_path)
          print(f"✅ CSV found: {file_path}")
          print("Rows:", len(df), "Cols:", len(df.columns))
          print("Diet types:", df['Diet_type'].dropna().unique()[:5])
          print("✅ Pandas read test passed.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local test)
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: diet-analysis:ci
          push: false
          load: true

      - name: Run container (simulate deployment)
        run: docker run --rm -e MPLBACKEND=Agg diet-analysis:ci
