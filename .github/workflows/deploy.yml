name: CI-CD (Docker build, lint, run, optional push)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 .

  build-and-run:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the Docker image from your Dockerfile (Task 2)
      - name: Build Docker image
        run: |
          docker build -t diet-analysis:ci .

      # Create a tiny CSV so the container can process something during CI
      - name: Create sample CSV
        run: |
          cat > sample.csv <<'CSV'
Diet_type,Recipe_name,Cuisine_type,Protein(g),Carbs(g),Fat(g)
Paleo,Test A,american,10,20,5
Keto,Test B,italian,30,5,15
Vegan,Test C,indian,12,40,6
Paleo,Test D,mexican,18,10,8
CSV

      # Run the container: mount workspace and generate outputs
      - name: Run container to process sample.csv
        run: |
          mkdir -p outputs
          docker run --rm -v "$PWD:/work" diet-analysis:ci /work/sample.csv --out /work/outputs
          ls -R outputs

      # Upload outputs as build artifact (proof the container ran)
      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: outputs

  push-dockerhub:
    if: github.ref == 'refs/heads/main'
    needs: build-and-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (release tag)
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/diet-analysis:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/diet-analysis:latest
