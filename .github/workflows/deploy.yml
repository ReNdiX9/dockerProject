name: CI/CD Pipeline Simulation (lint, build, run)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      # Force headless plotting so matplotlib works in CI
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pandas matplotlib seaborn
          fi

      # Fast validation that CSV is readable & pandas works
      - name: Smoke test (read CSV and print stats)
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("All_Diets.csv")
          print("Rows:", len(df), "Cols:", len(df.columns))
          print("Diet types:", df['Diet_type'].dropna().str.lower().nunique())
          print("OK: CSV loaded and basic stats computed.")
          PY

      # Build the Docker image using buildx and load it into the local Docker engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: diet-analysis:ci
          push: false
          load: true

      # Run the container; the script writes figures but no display is needed
      - name: Run container (simulate deployment)
        run: docker run --rm -e MPLBACKEND=Agg diet-analysis:ci
