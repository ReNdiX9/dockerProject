name: build/run workflow (headless matplotlib)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout (with LFS just in case)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show workspace
        run: |
          pwd
          ls -lah
          git rev-parse --short HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps (fallback if no requirements)
        run: |
          python -V
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pandas matplotlib seaborn
          fi

      - name: Smoke test (read CSV & print stats)
        run: |
          python - <<'PY'
          import os, pandas as pd
          assert os.path.exists("All_Diets.csv"), "All_Diets.csv not found in repo root"
          df = pd.read_csv("All_Diets.csv")
          print("Rows:", len(df), "Cols:", len(df.columns))
          print("Columns:", list(df.columns))
          print("Diet types (unique, case-insensitive):", df['Diet_type'].astype(str).str.lower().nunique())
          print("OK: CSV loaded and basic stats computed.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally)
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: diet-analysis:ci
          push: false
          load: true

      - name: Run container (simulate deployment)
        run: docker run --rm -e MPLBACKEND=Agg diet-analysis:ci
